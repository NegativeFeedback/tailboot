name: Build Tailboot release

on:
  push:
    tags:
      - "v*"
  schedule:
    # First day of each month at 04:17 UTC. Avoid the start of the hour, when jobs
    # are more likely to be delayed by GitHub Actions load.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: tailboot-release
  cancel-in-progress: false

jobs:
  release-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      iso_name: ${{ steps.metadata.outputs.iso_name }}
      iso_name_nowifi: ${{ steps.metadata.outputs.iso_name_nowifi }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_commit: ${{ steps.metadata.outputs.release_commit }}
      create_tag: ${{ steps.metadata.outputs.create_tag }}
      config_offset: ${{ steps.config.outputs.offset }}
      config_offset_nowifi: ${{ steps.config.outputs.offset_nowifi }}
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils bzip2 ca-certificates cpio curl debian-archive-keyring \
            debootstrap file gh \
            grub-efi-amd64-bin grub-pc-bin isolinux mtools \
            rsync squashfs-tools syslinux-common wget xorriso xz-utils zstd

          curl --fail --silent --show-error --location \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb" \
            --output "${RUNNER_TEMP}/live-build.deb"
          sudo apt-get install --yes --no-install-recommends \
            "${RUNNER_TEMP}/live-build.deb"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}

      - name: Define release artifact
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            release_tag=${PUSHED_TAG}
            create_tag=false
          else
            release_tag="v$(date -u +%Y.%m.%d.%H%M%S)"
            create_tag=true
          fi

          if ! printf '%s\n' "${release_tag}" \
            | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.([01][0-9]|2[0-3])[0-5][0-9][0-5][0-9]$'; then
            echo "Release tags must use UTC CalVer: vYYYY.MM.DD.HHMMSS." >&2
            exit 1
          fi

          iso_name="tailboot-${release_tag}-amd64.iso"
          iso_name_nowifi="tailboot-${release_tag}-amd64-no-wifi.iso"
          echo "iso_name=${iso_name}" >> "${GITHUB_OUTPUT}"
          echo "iso_name_nowifi=${iso_name_nowifi}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=${create_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Two full live-build runs, not one build patched into two images: both
      # variants go through live-build's own bootloader/El Torito/hybrid-boot
      # assembly unchanged, so neither can have a hand-rolled repack subtly
      # break BIOS/UEFI boot. The no-wifi variant runs first so the final
      # image/chroot left on disk for the steps below is the full variant,
      # matching this job's behavior before this variant existed.
      - name: Build no-wifi ISO
        run: |
          mkdir -p image/dist
          sudo ./image/scripts/build-iso.sh \
            "${{ steps.metadata.outputs.iso_name_nowifi }}" no-wifi

      - name: Build full ISO
        run: |
          sudo ./image/scripts/build-iso.sh "${{ steps.metadata.outputs.iso_name }}" full

      - name: Verify image contents and boot records
        run: |
          ./image/scripts/verify-iso.sh "image/dist/${{ steps.metadata.outputs.iso_name }}"
          ./image/scripts/verify-iso.sh "image/dist/${{ steps.metadata.outputs.iso_name_nowifi }}"

      - name: Verify configuration with Debian's NetworkManager
        run: sudo chroot image/chroot /bin/sh < image/scripts/test-configure.sh

      - name: Set up Node for ISO patch tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read configuration byte offsets
        id: config
        run: |
          offset=$(./image/scripts/config-offset.sh "image/dist/${{ steps.metadata.outputs.iso_name }}")
          echo "offset=${offset}" >> "${GITHUB_OUTPUT}"
          offset_nowifi=$(./image/scripts/config-offset.sh "image/dist/${{ steps.metadata.outputs.iso_name_nowifi }}")
          echo "offset_nowifi=${offset_nowifi}" >> "${GITHUB_OUTPUT}"

      - name: Test browser customizer against the built ISOs
        run: |
          node --test tailboot-iso.test.ts
          node image/scripts/test-iso-patch.ts \
            "image/dist/${{ steps.metadata.outputs.iso_name }}" "${{ steps.config.outputs.offset }}"
          node image/scripts/test-iso-patch.ts \
            "image/dist/${{ steps.metadata.outputs.iso_name_nowifi }}" "${{ steps.config.outputs.offset_nowifi }}"

      - name: Create checksums
        working-directory: image/dist
        run: |
          sha256sum "${{ steps.metadata.outputs.iso_name }}" > "${{ steps.metadata.outputs.iso_name }}.sha256"
          sha256sum "${{ steps.metadata.outputs.iso_name_nowifi }}" > "${{ steps.metadata.outputs.iso_name_nowifi }}.sha256"

      - name: Upload ISOs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-iso
          path: |
            image/dist/${{ steps.metadata.outputs.iso_name }}
            image/dist/${{ steps.metadata.outputs.iso_name }}.sha256
            image/dist/${{ steps.metadata.outputs.iso_name_nowifi }}
            image/dist/${{ steps.metadata.outputs.iso_name_nowifi }}.sha256
          compression-level: 0

  build-cli:
    needs: release-iso
    strategy:
      matrix:
        include:
          - runner: windows-2025
            asset: tailboot-windows-x64.exe
          - runner: ubuntu-24.04
            asset: tailboot-linux-x64
          - runner: ubuntu-24.04-arm
            asset: tailboot-linux-arm64
          - runner: macos-15
            asset: tailboot-macos-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-iso.outputs.release_commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Set up Zig for Windows
        if: runner.os == 'Windows'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1
        with:
          version: 0.16.0

      - name: Build CLI
        shell: bash
        env:
          SCRIPTC_CC: ${{ runner.os == 'Windows' && 'zigcc' || '' }}
          SCRIPTC_TARGET: ${{ runner.os == 'Windows' && 'x86_64-windows-gnu' || '' }}
          PUBLIC_TAILBOOT_ISO_NAME: ${{ needs.release-iso.outputs.iso_name }}
          PUBLIC_TAILBOOT_RELEASE: ${{ needs.release-iso.outputs.release_tag }}
          PUBLIC_TAILBOOT_CONFIG_OFFSET: ${{ needs.release-iso.outputs.config_offset }}
        run: |
          pnpm build:cli
          mv cli/dist/tailboot "cli/dist/${{ matrix.asset }}"

      - name: Upload CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.asset }}
          path: cli/dist/${{ matrix.asset }}

  publish-release:
    needs: [release-iso, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-iso.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.release-iso.outputs.release_commit }}
          CREATE_TAG: ${{ needs.release-iso.outputs.create_tag }}
          ISO_NAME: ${{ needs.release-iso.outputs.iso_name }}
          ISO_NAME_NOWIFI: ${{ needs.release-iso.outputs.iso_name_nowifi }}
        run: |
          if release=$(gh release view "${RELEASE_TAG}" --json isDraft,assets 2>/dev/null); then
            if [ "$(jq -r .isDraft <<< "${release}")" = "true" ]; then
              gh release upload "${RELEASE_TAG}" dist/* --clobber
              gh release edit "${RELEASE_TAG}" --draft=false
              exit 0
            fi

            assets=$(jq -r '.assets[].name' <<< "${release}")
            for iso_name in "${ISO_NAME}" "${ISO_NAME_NOWIFI}"; do
              if ! grep -Fxq "${iso_name}" <<< "${assets}" \
                || ! grep -Fxq "${iso_name}.sha256" <<< "${assets}"; then
                echo "The release exists without both expected ISO assets; refusing to modify it." >&2
                exit 1
              fi
              # Only reuse the rebuilt offset if the published ISO is identical.
              gh release download "${RELEASE_TAG}" --pattern "${iso_name}.sha256" \
                --dir "${RUNNER_TEMP}/tailboot-release" --clobber
              if ! cmp "dist/${iso_name}.sha256" \
                "${RUNNER_TEMP}/tailboot-release/${iso_name}.sha256"; then
                echo "The rebuilt ${iso_name} differs from the published release; refusing to deploy its offset." >&2
                exit 1
              fi
            done
            exit 0
          fi

          if [ "${CREATE_TAG}" = "true" ]; then
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              --target "${RELEASE_COMMIT}" \
              --title "Tailboot ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              --title "Tailboot ${RELEASE_TAG}" \
              --verify-tag
          fi
          gh release edit "${RELEASE_TAG}" --draft=false

  build-docker:
    needs: release-iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-iso.outputs.release_commit }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.23"

      - name: Test server
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: Download built ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-iso
          path: dist

      # This job does not need publish-release to succeed -- it patches from
      # this run's own build artifact, not a downloaded GitHub Release asset.
      - name: Stage base ISOs for the Docker build context
        run: |
          mv "dist/${{ needs.release-iso.outputs.iso_name }}" base.iso
          mv "dist/${{ needs.release-iso.outputs.iso_name_nowifi }}" base-nowifi.iso

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/negativefeedback/tailboot:${{ needs.release-iso.outputs.release_tag }}
            ghcr.io/negativefeedback/tailboot:latest
          build-args: |
            ISO_NAME=${{ needs.release-iso.outputs.iso_name }}
            ISO_NAME_NOWIFI=${{ needs.release-iso.outputs.iso_name_nowifi }}
            RELEASE_TAG=${{ needs.release-iso.outputs.release_tag }}
            CONFIG_OFFSET=${{ needs.release-iso.outputs.config_offset }}
            CONFIG_OFFSET_NOWIFI=${{ needs.release-iso.outputs.config_offset_nowifi }}
